[versions]
agp = "8.6.1"
kotlin = "2.2.0-RC"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.10.1"
constraintlayout = "2.2.1"
moshi = "2.11.0"
retrofit = "2.11.0"
datastore = "1.1.7"
ksp = "2.2.0-RC-2.0.1"
moshi_codegen = "1.15.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
